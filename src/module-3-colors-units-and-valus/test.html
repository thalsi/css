<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .px {
        font-size: 20px;
        }

        .pt {
        font-size: 14pt;
        }

        .cm {
        width: 5cm;
        background: lightblue;
        }

        .mm {
        height: 20mm;
        background: lightgreen;
        }

        .inch {
        width: 2in;
        background: pink;
        }

        .pc {
        font-size: 2pc;
        }
    </style>
</head>
<body>
    
    <div class="px">Pixel</div>
    <div class="pt">Point</div>
    <div class="cm">Centimeter</div>
    <div class="mm">Millimeter</div>
    <div class="inch">Inch</div>
    <div class="pc">Pica</div>
</body>
</html>
