<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .px {
        font-size: 20px;
        }

        .pt {
        font-size: 14pt;
        }

        .cm {
        width: 5cm;
        background: lightblue;
        }

        .mm {
        height: 20mm;
        background: lightgreen;
        }

        .inch {
        width: 2in;
        background: pink;
        }

        .pc {
        font-size: 2pc;
        }

        .parent {
        width: 400px;
        height: 200px;
        background: lightgray;

        font-size: 32px;
        }

        .child {
        width: 50%;
        height: 50%;
        background: steelblue;
        font-size: 2em;
        }


        html{
        font-size:16px;
    }

    .container{
        width:80%;
    }

    h1{
        font-size:2rem;
    }

    p{
        font-size:1.5em;
    }

    input{
        width:20ch;
    }

    .hero{
        height:100vh;
    }
    </style>
</head>
<body>
    
    <div class="px">Pixel</div>
    <div class="pt">Point</div>
    <div class="cm">Centimeter</div>
    <div class="mm">Millimeter</div>
    <div class="inch">Inch</div>
    <div class="pc">Pica</div>


    <div class="parent">
        AAbb
        <div class="child">AAbb</div>
    </div>

    <div class="container">
    <h1>CSS Units</h1>

    <p>Hello World</p>

    <input placeholder="Username">
</div>
</body>
</html>
