<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baic Selectors</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    
    <div class="container">
        <h1>Heading H1</h1>
        <div class="container-body">
            <p>Element Selector</p>
            <p id="id-selector">id Selector</p>
            <ul>
                <li>item 1</li>
                <li>item 2</li>
                <li>item 3</li>
            </ul>
        </div>
    </div>

    <hr>
    <div class="descendant-selector">
        <p>Paragraph 1</p>
        <section>
            <p>Paragraph 2</p>
            <article>
                <p>Paragraph 3</p>
            </article>
        </section>
    </div>


    <hr>
    <div class="child-selector">
        <p>Paragraph 1</p>
        <section>
            <p>Paragraph 2</p>
            <article>
                <p>Paragraph 3</p>
            </article>
        </section>
        <p>Paragraph 1</p>
    </div>
    
    
    <hr>
    <div >
        <h2 class="adjacent-selector">Heading</h2>

        <p>Paragraph 1</p>

        <p>Paragraph 2</p>

        <p>Paragraph 3</p>
    </div>
    

    <hr>
    <div >
        <h2 class="general-sibling-selector">Heading</h2>

        <p>Paragraph 1</p>

        <p>Paragraph 2</p>

        <p>Paragraph 3</p>
    </div>


</body>
</html>
