<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="test.css">
</head>
<body>

    <!-- 1. :Hover -->
    <button class="btn-hover">Click</button>

    <!-- 2. :Focus -->
    <input type="text" class="input-focus">

    <!-- 3. :focus-within -->
    <div class="box">
        <label>Name</label>
        <input type="text">
    </div>

    <!-- 4. :focus-visible -->
    <input type="text" class="input-focus-visible">

    <!-- 5. :active -->
    <button class="btn-active">Click</button>

    <!-- 6. :checked -->
    <input type="checkbox" id="c1">
    <label for="c1">Accept Terms</label>

    
</body>
</html>
